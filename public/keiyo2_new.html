<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>駅の新規登録</title>
</head>
<body>
  <h2>駅の新規登録</h2>

  <form action="/keiyo2" method="POST">
    <p>駅コード：<input name="code" required></p>
    <p>駅名：<input name="name" required></p>
    <p>乗り換え線：<input name="change"></p>
    <p>乗降客数：<input type="number" name="passengers" required></p>
    <p>東京駅からの距離：
      <input type="number" step="0.1" name="distance" required>
    </p>
    <input type="submit" value="登録">
  </form>

  <a href="/keiyo2">一覧に戻る</a>
</body>
</html>
